name: Deploy OpenGLESScope Database
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Validated release or report snapshot refresh"
        type: choice
        required: true
        default: release
        options:
          - release
          - snapshot
      report_id:
        description: "Exact accepted lowercase 64-hex report ID"
        type: string
        required: false
      submitted_at:
        description: "Server timestamp, informational only"
        type: string
        required: false
permissions:
  contents: read
jobs:
  release-publish:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main source
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate release source and security
        run: |
          python tools/repair_repository.py --check
          python tools/quality_gate.py
          python tools/audit_database.py --source-tree .
      - name: Build static index
        run: python tools/build_index.py
      - name: Stage allowlisted Pages artifact
        run: python tools/build_pages_artifact.py _site
      - name: Refresh authoritative live index
        run: |
          python tools/build_live_index.py _site/data/index.json
          python tools/audit_database.py --artifact-tree _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy validated release
        id: deployment
        uses: actions/deploy-pages@v4
  snapshot-refresh:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate snapshot trigger
        shell: bash
        env:
          REPORT_ID: ${{ inputs.report_id }}
        run: |
          set -euo pipefail
          [[ "$REPORT_ID" =~ ^[a-f0-9]{64}$ ]] || { echo "Snapshot requires the exact accepted report ID" >&2; exit 1; }
      - name: Checkout current main source
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate snapshot source and security
        run: |
          python tools/repair_repository.py --check
          python tools/quality_gate.py
          python tools/audit_database.py --source-tree .
      - name: Build static index
        run: python tools/build_index.py
      - name: Stage allowlisted Pages artifact
        run: python tools/build_pages_artifact.py _site
      - name: Refresh authoritative live index including triggering report
        shell: bash
        env:
          REPORT_ID: ${{ inputs.report_id }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if python tools/build_live_index.py _site/data/index.json --expect-report-id "$REPORT_ID"; then
              ready=1
              break
            fi
            if [ "$attempt" -lt 8 ]; then sleep 2; fi
          done
          [ "$ready" -eq 1 ] || { echo "Accepted report is not in authoritative Worker list" >&2; exit 1; }
          python tools/audit_database.py --artifact-tree _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated snapshot artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy refreshed snapshot
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published accepted report
        shell: bash
        env:
          REPORT_ID: ${{ inputs.report_id }}
        run: python tools/verify_published_snapshot.py --expect-report-id "$REPORT_ID"
